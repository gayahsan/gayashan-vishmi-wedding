<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f7f3ec" />
    <title>Welcome — Gayashan &amp; Vishmi</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;1,400&display=block"
      rel="stylesheet"
    />

    <style>
      :root {
        --ivory: #f7f3ec;
        --paper: #fffdf9;
        --ink: #292b27;
        --muted: #65655e;
        --sage: #66745f;
        --sage-dark: #4d5948;
        --blush: #d8b7ad;
        --gold: #ae8b57;
        --line: rgba(41, 43, 39, 0.14);
        --serif: "Playfair Display", Georgia, serif;
        --sans: "DM Sans", system-ui, sans-serif;
        --script: "Great Vibes", cursive;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        color: var(--ink);
        background: #1d1e1b;
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }

      /* 80 × 142 cm portrait screen (9:16). Every size is in 1080-wide design pixels. */
      .poster {
        --u: calc(100cqw / 1080);
        container-type: inline-size;
        position: relative;
        width: min(100vw, 100vh * 9 / 16);
        aspect-ratio: 9 / 16;
        overflow: hidden;
        isolation: isolate;
        background: var(--ivory);
      }

      .stage {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: calc(150 * var(--u)) calc(110 * var(--u)) calc(140 * var(--u));
        text-align: center;
        background:
          radial-gradient(circle at 6% 3%, rgba(216, 183, 173, 0.42), transparent calc(560 * var(--u))),
          radial-gradient(circle at 98% 46%, rgba(102, 116, 95, 0.17), transparent calc(620 * var(--u))),
          radial-gradient(circle at 8% 98%, rgba(102, 116, 95, 0.14), transparent calc(600 * var(--u))),
          var(--ivory);
      }

      .frame {
        position: absolute;
        inset: calc(52 * var(--u));
        border: calc(1.5 * var(--u)) solid rgba(174, 139, 87, 0.32);
        pointer-events: none;
      }

      .frame::before,
      .frame::after {
        content: "";
        position: absolute;
        width: calc(150 * var(--u));
        height: calc(150 * var(--u));
      }

      .frame::before {
        top: calc(22 * var(--u));
        left: calc(22 * var(--u));
        border-top: calc(3 * var(--u)) solid var(--gold);
        border-left: calc(3 * var(--u)) solid var(--gold);
      }

      .frame::after {
        right: calc(22 * var(--u));
        bottom: calc(22 * var(--u));
        border-right: calc(3 * var(--u)) solid var(--gold);
        border-bottom: calc(3 * var(--u)) solid var(--gold);
      }

      .eyebrow {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: calc(26 * var(--u));
        margin: 0;
        color: var(--sage-dark);
        font-size: calc(25 * var(--u));
        font-weight: 600;
        letter-spacing: 0.32em;
        text-transform: uppercase;
      }

      .eyebrow::before,
      .eyebrow::after {
        content: "";
        width: calc(70 * var(--u));
        height: calc(2 * var(--u));
        background: var(--gold);
      }

      .welcome {
        margin: calc(10 * var(--u)) 0 0;
        font-family: var(--script);
        font-size: calc(160 * var(--u));
        font-weight: 400;
        line-height: 1;
      }

      .portrait {
        position: relative;
        flex: none;
        width: calc(520 * var(--u));
        height: calc(660 * var(--u));
        margin: calc(22 * var(--u)) 0 calc(44 * var(--u));
      }

      .portrait::before {
        content: "";
        position: absolute;
        inset: calc(-22 * var(--u));
        border: calc(2 * var(--u)) solid rgba(174, 139, 87, 0.6);
        border-radius: calc(282 * var(--u)) calc(282 * var(--u)) calc(14 * var(--u)) calc(14 * var(--u));
      }

      .portrait img {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 22%;
        border-radius: calc(260 * var(--u)) calc(260 * var(--u)) calc(6 * var(--u)) calc(6 * var(--u));
        box-shadow: 0 calc(40 * var(--u)) calc(90 * var(--u)) rgba(52, 48, 40, 0.2);
      }

      .names {
        margin: 0;
        font-family: var(--script);
        font-size: calc(116 * var(--u));
        font-weight: 400;
        line-height: 0.82;
      }

      .names span {
        display: block;
      }

      .names .and {
        margin: calc(8 * var(--u)) 0 calc(4 * var(--u));
        color: var(--gold);
        font-family: var(--serif);
        font-size: calc(36 * var(--u));
        font-style: italic;
        letter-spacing: 0.1em;
        line-height: 1.4;
      }

      .details {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .date-mark {
        width: calc(520 * var(--u));
        padding: calc(22 * var(--u)) 0 calc(26 * var(--u));
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        border-block: calc(1.5 * var(--u)) solid var(--line);
      }

      .date-mark .side {
        color: var(--muted);
        font-size: calc(22 * var(--u));
        font-weight: 600;
        letter-spacing: 0.2em;
        line-height: 1.45;
        text-transform: uppercase;
      }

      .date-mark .day {
        padding: 0 calc(34 * var(--u));
        color: var(--sage-dark);
        font-family: var(--serif);
        font-size: calc(92 * var(--u));
        line-height: 0.95;
      }

      .venue {
        margin: calc(34 * var(--u)) 0 0;
        font-family: var(--serif);
        font-size: calc(48 * var(--u));
        line-height: 1.15;
        letter-spacing: -0.01em;
      }

      .place {
        margin: calc(12 * var(--u)) 0 0;
        color: var(--muted);
        font-size: calc(24 * var(--u));
        font-weight: 500;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .note {
        margin: 0;
        color: var(--muted);
        font-family: var(--serif);
        font-size: calc(36 * var(--u));
        font-style: italic;
      }

      .download {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        padding: 0.75rem 1.15rem;
        color: #fff;
        background: var(--sage);
        border-radius: 999px;
        font: 500 0.82rem/1 var(--sans);
        letter-spacing: 0.04em;
        text-decoration: none;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.25);
      }

      .download:hover {
        background: var(--sage-dark);
      }

      body.display {
        cursor: none;
      }

      body.display .download {
        display: none;
      }
    </style>
  </head>
  <body>
    <main class="poster" aria-label="Welcome to Gayashan and Vishmi's wedding">
      <div class="stage">
        <div class="frame" aria-hidden="true"></div>

        <header>
          <p class="eyebrow">To our new beginning</p>
          <h1 class="welcome">Welcome</h1>
        </header>

        <div class="portrait">
          <img src="welcome-poster-photo.jpg" alt="Gayashan and Vishmi" />
        </div>

        <h2 class="names">
          <span>Gayashan</span>
          <span class="and">and</span>
          <span>Vishmi</span>
        </h2>

        <div class="details">
          <div class="date-mark" aria-label="Monday, October 5, 2026">
            <span class="side">Monday</span>
            <span class="day">05</span>
            <span class="side">October<br />2026</span>
          </div>
          <p class="venue">Centurion’s Banquet</p>
          <p class="place">Divulapitiya</p>
        </div>

        <p class="note">We are so glad you are here.</p>
      </div>
    </main>

    <a class="download" href="welcome-poster.jpg" download="Gayashan-Vishmi-welcome-80x142cm-4K.jpg">
      Download 4K poster (80 × 142 cm)
    </a>

    <script>
      if (new URLSearchParams(location.search).has("display")) {
        document.body.classList.add("display");
      }
    </script>
  </body>
</html>
